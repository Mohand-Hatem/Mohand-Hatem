<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306" role="img" aria-labelledby="t d">
  <title id="t">Full Stack &amp; AI Engineer</title>
  <desc id="d">Specializing in the design and delivery of scalable, production-grade web applications. Experienced across the full software lifecycle, from system architecture and secure API development to high-quality user interfaces, with a focus on integrating LLMs, RAG pipelines and AI agents into real-world products.</desc>
  <defs>
    <!-- rotating teal/amber gradient drives the animated border -->
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="306">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="0.5" stop-color="#F4A259"/>
      <stop offset="1" stop-color="#2EC4B6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 450 153" to="360 450 153" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#141B26"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- outer glow, pulsing -->
  <rect x="10" y="10" width="880" height="286" rx="18" fill="none" stroke="url(#border)" stroke-width="6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="10" y="10" width="880" height="286" rx="18" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <!-- status dot -->
    <circle cx="52" cy="58" r="6" fill="#2EC4B6"/>
    <circle cx="52" cy="58" r="6" fill="none" stroke="#2EC4B6" stroke-width="2">
      <animate attributeName="r" values="6;13;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="66" font-size="26" font-weight="700" fill="#2EC4B6">Full Stack &amp; AI Engineer</text>

    <g font-size="19" fill="#C9D1D9">
      <text x="44" y="114">Specializing in the design and delivery of scalable, production-grade web applications.</text>
      <text x="44" y="146">Experienced across the full software lifecycle, from system architecture and secure API</text>
      <text x="44" y="178">development to high-quality user interfaces, with a focus on integrating <tspan fill="#F4A259" font-weight="600">LLMs, RAG</tspan></text>
      <text x="44" y="210"><tspan fill="#F4A259" font-weight="600">pipelines and AI agents</tspan> into real-world products.</text>
    </g>

    <g font-size="14" fill="#8B949E" text-anchor="middle">
      <rect x="44" y="238" width="170" height="30" rx="15" fill="#2EC4B6" fill-opacity="0.08" stroke="#2EC4B6" stroke-opacity="0.45"/>
      <text x="129" y="258">System Architecture</text>
      <rect x="226" y="238" width="120" height="30" rx="15" fill="#2EC4B6" fill-opacity="0.08" stroke="#2EC4B6" stroke-opacity="0.45"/>
      <text x="286" y="258">Secure APIs</text>
      <rect x="358" y="238" width="160" height="30" rx="15" fill="#2EC4B6" fill-opacity="0.08" stroke="#2EC4B6" stroke-opacity="0.45"/>
      <text x="438" y="258">Modern Interfaces</text>
      <rect x="530" y="238" width="190" height="30" rx="15" fill="#F4A259" fill-opacity="0.08" stroke="#F4A259" stroke-opacity="0.45"/>
      <text x="625" y="258">LLMs · RAG · AI Agents</text>
    </g>
  </g>
</svg>
